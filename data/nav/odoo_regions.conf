# Odoo arch-token -> six-region map (furnace convention config, sanctioned
# output #2). Knowledge transfer of ruff PR #76's region grammar; see
# docs/knowledge/ODOO-REGION-GRAMMAR.md for the grounding and the three-edit
# recipe. Consumed by ruff exam_config's `region=` directive
# (ruff_spo_triplet/src/exam_config.rs). Format: region=<dock_token>:<region>.
# The six canonical regions: top_bar / left_nav / center / right_panel /
# bottom_bar / popup. Region names are free strings FROM config — edit here,
# never in Rust. A row with no `:` is dropped (malformed can't mis-dock).

# top_bar — the top action/filter strip (DockStyle.Top analogue)
region=header:top_bar
region=search:top_bar
region=filter:top_bar

# left_nav — the left category/filter rail (DockStyle.Left)
region=searchpanel:left_nav

# center — the main record body / primary data view (DockStyle.Fill)
region=sheet:center
region=form:center
region=group:center
region=field:center
region=separator:center
region=list:center
region=tree:center
region=kanban:center
region=notebook:center
region=page:center

# right_panel — the messaging/activity side panel (DockStyle.Right)
region=chatter:right_panel

# bottom_bar — wizard dialog action bar (DockStyle.Bottom)
region=footer:bottom_bar

# popup — dropdown / cog menu / act_window target="new" wizard
region=action_menu:popup
