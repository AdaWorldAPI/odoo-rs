[package]
name = "od-ontology"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Odoo's business-logic ontology lowered to native SurrealDB DDL (DEFINE TABLE/FIELD/FUNCTION/EVENT). Not an ORM; not a migration tool."
repository = "https://github.com/AdaWorldAPI/odoo-rs"

[dependencies]
# serde-only, mirroring ruff_spo_triplet — the SPO corpus is JSON; the AST emit
# side is pure (zero deps). No surrealdb-core (tokio + rust-1.95 + rocksdb is
# disproportionate for "emit DDL"; we mirror its catalog shape instead).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OGAR canonical layer + ruff frontend — pulled ONLY under the `ogar-emit`
# feature. The default build stays serde-only (zero cost for lib consumers).
# Together they provide the odoo-rs <-> OGAR convergence:
#   * ogar-vocab             — the shared `ogar_vocab::Class` IR + OdooPort codebook
#   * ogar-adapter-surrealql — the shared SurrealQL emitter. Its EMIT path is
#                              dep-light (ogar-vocab + a hand-written formatter);
#                              `surrealdb` is gated behind that crate's
#                              `surrealdb-parser` feature (the parse-back leg),
#                              which we do NOT enable — so the convergence emit
#                              path builds offline.
#   * ogar-from-ruff         — the per-class transpile substrate, OGAR #132:
#                              `mint::compile_graph_python::<OdooPort>` (lift+mint)
#   * ruff_python_spo        — parse Odoo source `.py` -> `ruff_spo_triplet::ModelGraph`
#
# SOURCE-ALIGNMENT (Codex P1 on #20): `ruff_python_spo` and OGAR's
# `ogar-from-ruff` both depend on `ruff_spo_triplet` — the `ModelGraph` type.
# They MUST resolve to the SAME cargo source, or the types won't unify (the
# graph `extract_from_source` returns wouldn't be accepted by
# `compile_graph_python`). So the pins are deliberately mutually-consistent:
#   * OGAR `rev = 7d0dca2` — current OGAR main; carries #132 `ogar-from-ruff` +
#     the Stage-A `array<record<…>>` emitter (supersedes the pre-#132 597ecb12).
#   * `ruff_python_spo` `rev = 4860e79` — the EXACT ruff rev OGAR 7d0dca2's
#     `ogar-from-ruff` pins for `ruff_spo_triplet`, so the graph has ONE source.
# A bump is a deliberate lockstep step (advance BOTH to the new OGAR main + the
# ruff rev that main's `ogar-from-ruff` pins), per od-ontology's rev-pin
# convention. The `ogar-adapter-surrealql` EMIT path is dep-light (zero
# surrealdb — that's gated behind its `surrealdb-parser` feature, off here), so
# the convergence builds offline. Stage B adds the `source -> ruff ->
# compile_graph -> shared emit` path ALONGSIDE the native one; W3.3 stays gated.
# DEP-FLIP READINESS (2026-07-06): R-1 (`ruff_python_spo`) IS on ruff main
# (crate present at origin/main); R-2 (SQLAlchemy brick) NOT yet. The flip
# stays gated on OGAR O-2 de-pinning its own ruff rev (source-alignment above);
# flip = advance BOTH pins LOCKSTEP to `branch = "main"`, never one alone.
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", rev = "7d0dca200472e133416fb961c065570d5159effa", optional = true }
ogar-adapter-surrealql = { git = "https://github.com/AdaWorldAPI/OGAR", rev = "7d0dca200472e133416fb961c065570d5159effa", optional = true }
ogar-from-ruff = { git = "https://github.com/AdaWorldAPI/OGAR", rev = "7d0dca200472e133416fb961c065570d5159effa", optional = true }
ruff_python_spo = { git = "https://github.com/AdaWorldAPI/ruff", rev = "4860e7987aa0c9453f812bb0178962d1cba66df0", optional = true }

[features]
# Opt-in CLI (mirrors openproject-nexgen-rs#31's `--features cli` discipline).
# Lib consumers without the feature pay zero extra cost; the bin + its tests
# only compile under this flag.
cli = []
# Stage 1 parallel-emit convergence path. Lowers the bespoke `Schema` onto
# `ogar_vocab::Class` and emits via `ogar-adapter-surrealql`, ALONGSIDE the
# native `ToSql` emit — additive, never replacing. Lib consumers without the
# feature pay zero cost; the bridge module + its convergence test only
# compile under this flag.
ogar-emit = [
    "dep:ogar-vocab",
    "dep:ogar-adapter-surrealql",
    "dep:ogar-from-ruff",
    "dep:ruff_python_spo",
]

[[bin]]
name = "od-codegen"
path = "src/bin/od_codegen.rs"
required-features = ["cli"]

# End-to-end "pull OGAR via class" demo. Uses the `ogar-emit`-gated classid
# surface (concept_classid / render_classid / schema_classids /
# emit_via_ogar_annotated), so it only builds under the feature — otherwise a
# default `cargo build --examples` would fail on the gated symbols.
[[example]]
name = "classid_pull"
required-features = ["ogar-emit"]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "warn"
