[package]
name = "od-ontology"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Odoo's business-logic ontology lowered through the OGAR V3 transpile substrate (compile_source -> CompiledClass) and pulled into the shared OGAR classid codebook. Not an ORM; not a SurrealQL codegen tool."
repository = "https://github.com/AdaWorldAPI/odoo-rs"

[dependencies]
# serde-only, mirroring ruff_spo_triplet — the SPO corpus is JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OGAR canonical layer + ruff frontend — UNCONDITIONAL deps (operator ruling
# 2026-07-06: no bridges — consumers consume ogar-vocab directly, and OGAR is
# ALWAYS compiled into the same binary; the former `ogar-emit` opt-in gate is
# retired). Together they provide the odoo-rs <-> OGAR convergence:
#   * ogar-vocab             — the shared `ogar_vocab::Class` IR + OdooPort codebook
#   * ogar-from-ruff         — the per-class transpile substrate, OGAR #132:
#                              `mint::compile_graph_python::<OdooPort>` (lift+mint)
#   * ruff_python_spo        — parse Odoo source `.py` -> `ruff_spo_triplet::ModelGraph`
#
# NOTE (2026-07-06): `ogar-adapter-surrealql` was dropped from this list —
# SurrealQL is deprecated (operator ruling: "SurrealQL is absolutely
# deprecated. OGAR V3 for transpile substrate, lance-graph V3 for database.").
# It was only ever pulled in for the now-deleted `emit_via_ogar*` DDL-emit
# path (`surreal_ast.rs` / `emit.rs`, see `docs/W3.3-DELETE-GATE-MATRIX.md`).
#
# SOURCE-ALIGNMENT (Codex P1 on #20): `ruff_python_spo` and OGAR's
# `ogar-from-ruff` both depend on `ruff_spo_triplet` — the `ModelGraph` type.
# They MUST resolve to the SAME cargo source or the types won't unify. Both
# sides float on `branch = "main"`, so the sources unify by construction.
#
# D-NEVER-PIN-BUMP (operator ruling, OGAR #166, 2026-07-06): "wir machen
# NIEMALS pin bump." Every cross-repo dep floats on branch = "main" — an
# upstream change breaking this build loudly and immediately is the FEATURE
# (surface + fix-forward within minutes), never a defect to pin away. Do not
# reintroduce rev pins here. (Historical rev-pin/lockstep narration removed;
# the O-2 arc that got us to float-on-main lives in the git history of this
# block and in docs/ODOO-OGAR-MIGRATION-SPRINT.md.)
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
ogar-from-ruff = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
ruff_python_spo = { git = "https://github.com/AdaWorldAPI/ruff", branch = "main" }
# ruff_spo_triplet — the canonical SPO carrier (`Triple` + `from_ndjson` +
# `ParseError`), consumed directly since council-Q1 (2026-07-07) retired
# odoo-rs's byte-identical local copy in `triple.rs`. Same source as
# `ruff_python_spo` / `ogar-from-ruff`'s transitive `ruff_spo_triplet`
# (branch = "main"), so the `Triple`/`ModelGraph` types unify by construction.
ruff_spo_triplet = { git = "https://github.com/AdaWorldAPI/ruff", branch = "main" }

# lance-graph-contract — the zero-dep OGAR contract crate. Pulled ONLY under
# the `fieldmask` feature, to mint `WideFieldMask` (lance-graph #651/#653,
# MERGED) from view_mask's harvest-side `MaskWords`. The default build stays
# serde-only; lib consumers who don't ask for `fieldmask` pay zero cost.
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main", optional = true }

[features]
# Opt-in CLI (mirrors openproject-nexgen-rs#31's `--features cli` discipline).
# Lib consumers without the feature pay zero extra cost; the bin + its tests
# only compile under this flag.
cli = []
# Wide-field-mask convergence: mint `lance_graph_contract::WideFieldMask` from
# view_mask's `MaskWords` harvest artifact (the named follow-up documented in
# view_mask.rs's module docs, now unblocked by lance-graph #651/#653). Lib
# consumers without the feature pay zero cost; `view_mask::mint_wide_mask` +
# its parity test only compile under this flag.
fieldmask = ["dep:lance-graph-contract"]

[[bin]]
name = "od-codegen"
path = "src/bin/od_codegen.rs"
required-features = ["cli"]

# End-to-end "pull OGAR via class" demo (the classid surface is always
# compiled in — see the unconditional-deps note above).
[[example]]
name = "classid_pull"

[[test]]
name = "wide_mask_parity"
required-features = ["fieldmask"]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "warn"
