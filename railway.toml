# Railway deployment for odoo-rs (Odoo→OGAR transpiler host).
# https://docs.railway.app/reference/config-as-code
#
# Deploy: Railway builds the Dockerfile, injects $PORT, and health-checks
# /health. od-server binds 0.0.0.0:$PORT and serves the transpiler over HTTP.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "od-server"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# ── Environment contract ────────────────────────────────────────────────
# PORT              — injected by Railway; od-server binds 0.0.0.0:$PORT.
# STORAGE_BACKEND   — "lance-graph" (native V3 sink, canonical) | "postgres"
#                     (3×SPOG facet-table ORM shape). Surfaced on / and
#                     /health; the hydration writer is a documented follow-up.
# OD_CODEGEN        — optional absolute path to od-codegen (defaults to the
#                     PATH-installed binary in the image).
